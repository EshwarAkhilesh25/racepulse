server.port=8080
spring.application.name=racepulse-backend

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Load application-local.properties for local dev (gitignored)
spring.config.import=optional:classpath:application-local.properties

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# CORS Settings - support development and production origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://racepulse.vercel.app}

# External API Configuration
openf1.base.url=${OPENF1_BASE_URL:https://api.openf1.org/v1}
jolpica.base.url=${JOLPICA_BASE_URL:https://api.jolpi.ca/ergast/f1}

# Optional API Keys for enhanced features
youtube.api.key=${YOUTUBE_API_KEY:}
groq.api.key=${GROQ_API_KEY:}
gnews.api.key=${GNEWS_API_KEY:}

# Scheduling & Cache Configuration
timing.poll.interval=2000
cache.default.ttl.minutes=15

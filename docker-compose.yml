version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: racepulse-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racepulse-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    container_name: racepulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
